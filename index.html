<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARCELO CHESS</title>
    <!-- CSS do Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --button-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        #board {
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }

        /* Cores modernas para as casas do tabuleiro */
        .white-1e1d7 {
            background-color: #e2e8f0 !important;
            color: #e2e8f0 !important;
        }
        .black-3c85d {
            background-color: #475569 !important;
            color: #475569 !important;
        }

        /* Destaque para as casas onde a peça pode ir */
        .highlight {
            box-shadow: inset 0 0 4px 4px rgba(56, 189, 248, 0.8);
            background-color: rgba(56, 189, 248, 0.3) !important;
        }

        .info {
            background: var(--card-bg);
            padding: 18px 22px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #status {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
            color: #cbd5e1;
        }

        .controls-row {
            display: flex;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
        }

        .control-group label {
            font-size: 12px;
            margin-bottom: 4px;
            color: #94a3b8;
        }

        select, button {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }

        select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- Player de Áudio -->
    <div class="audio-player-container" style="margin-bottom: 10px;">
        <audio controls loop>
            <source src="audio/starwars-theme.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <h1>MARCELO CHESS</h1>
    
    <!-- Tabuleiro -->
    <div id="board"></div>

    <!-- Informações e Controles -->
    <div class="info">
        <p id="status">Sua vez (Brancas)</p>
        
        <div class="controls-row">
            <div class="control-group">
                <label for="playerColor">Sua Cor:</label>
                <select id="playerColor">
                    <option value="w" selected>Brancas</option>
                    <option value="b">Pretas</option>
                </select>
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button id="resetBtn">Nova Partida</button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Chessboard.js -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var statusEl = $('#status');
        var selectedSquare = null;
        var graySquares = [];
        var playerColor = 'w';

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight');
            graySquares = [];
        }

        function greySquare(square) {
            var $square = $('#board .square-' + square);
            $square.addClass('highlight');
            graySquares.push(square);
        }

        function makeSmartMove() {
            var possibleMoves = game.moves({ verbose: true });

            if (possibleMoves.length === 0 || game.game_over()) return;

            var captures = possibleMoves.filter(function(move) {
                return move.captured;
            });

            var chosenMove;
            if (captures.length > 0 && Math.random() < 0.85) {
                var randomCaptureIdx = Math.floor(Math.random() * captures.length);
                chosenMove = captures[randomCaptureIdx];
            } else {
                var randomIdx = Math.floor(Math.random() * possibleMoves.length);
                chosenMove = possibleMoves[randomIdx];
            }

            game.move(chosenMove);
            board.position(game.fen());
            updateStatus();

            if (!game.game_over() && game.turn() !== playerColor) {
                window.setTimeout(makeSmartMove, 400);
            }
        }

        function maybeTriggerRobot() {
            if (!game.game_over() && game.turn() !== playerColor) {
                statusEl.text('Robô pensando...');
                window.setTimeout(makeSmartMove, 400);
            }
        }

        function onSquareClick(square) {
            if (game.turn() !== playerColor) return;

            // Se já tem uma peça selecionada, tenta mover para a casa clicada
            if (selectedSquare !== null) {
                var move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    board.position(game.fen());
                    removeHighlights();
                    selectedSquare = null;
                    updateStatus();
                    maybeTriggerRobot();
                    return;
                }
            }

            // Seleciona a peça se for do jogador
            var piece = game.get(square);
            if (piece !== null && piece.color === playerColor) {
                selectedSquare = square;

                var moves = game.moves({
                    square: square,
                    verbose: true
                });

                if (moves.length === 0) {
                    removeHighlights();
                    selectedSquare = null;
                    return;
                }

                removeHighlights();
                greySquare(square);
                for (var i = 0; i < moves.length; i++) {
                    greySquare(moves[i].to);
                }
            } else {
                removeHighlights();
                selectedSquare = null;
            }
        }

        function updateStatus() {
            var status = '';
            var isMyTurn = (game.turn() === playerColor);
            var moveColor = (game.turn() === 'w') ? 'Brancas' : 'Pretas';

            if (game.in_checkmate()) {
                var winner = (game.turn() === 'w') ? 'Pretas' : 'Brancas';
                status = 'Fim de jogo! Xeque-mate. ' + winner + ' venceram!';
            } else if (game.in_draw()) {
                status = 'Fim de jogo! Empate.';
            } else {
                status = isMyTouchOrClickTurn = isMyTurn ? 'Sua vez (' + (playerColor === 'w' ? 'Brancas' : 'Pretas') + ')' : 'Vez do Robô';
                if (game.in_check()) {
                    status += ' — ' + moveColor + ' em XEQUE!';
                }
            }

            statusEl.text(status);
        }

        function resetGame() {
            playerColor = $('#playerColor').val();
            game.reset();
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.start();
            removeHighlights();
            selectedSquare = null;
            updateStatus();

            if (playerColor === 'b') {
                maybeTriggerRobot();
            }
        }

        var config = {
            draggable: false, // Desativado para priorizar o clique exato nas casas
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png'
        };

        board = Chessboard('board', config);

        // Captura cliques em qualquer elemento da casa (inclusive na imagem da peça) em PC e Celular
        $(document).on('click', '#board .square-55d63, #board img', function(e) {
            e.stopPropagation();
            var $squareDiv = $(this).hasClass('square-55d63') ? $(this) : $(this).closest('.square-55d63');
            var square = $squareDiv.attr('data-square');
            if (square) {
                onSquareClick(square);
            }
        });

        // Eventos
        $('#resetBtn').on('click', resetGame);
        $('#playerColor').on('change', resetGame);

        updateStatus();

        $(window).resize(function() {
            board.resize();
        });
    </script>
</body>
</html>
