<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marcelo Chess - Marble Edition</title>
    <!-- CSS do Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(18, 18, 18, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-glow: rgba(56, 189, 248, 0.4);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Container do Tabuleiro */
        #board {
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
            box-shadow: 0 25px 50px -12px rgba(255, 255, 255, 0.08), 0 0 30px rgba(56, 189, 248, 0.15);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* Textura e Cores de Mármore para as casas do xadrez */
        .white-1e1d7 {
            background-color: #e2e8f0 !important; /* Mármore Claro / Branco Suave */
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(203, 213, 225, 0.6) 100%);
        }
        .black-3c85d {
            background-color: #334155 !important; /* Mármore Escuro / Grafite Elegante */
            background-image: radial-gradient(circle, rgba(51, 65, 85, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        /* Destaque Moderno em Neon Animado */
        @keyframes pulseGlow {
            0% { box-shadow: inset 0 0 0 3px var(--accent-color), 0 0 12px var(--accent-glow); }
            50% { box-shadow: inset 0 0 0 6px var(--accent-hover), 0 0 22px var(--accent-glow); }
            100% { box-shadow: inset 0 0 0 3px var(--accent-color), 0 0 12px var(--accent-glow); }
        }

        .highlight {
            animation: pulseGlow 1.4s infinite ease-in-out;
            background-color: rgba(56, 189, 248, 0.35) !important;
        }

        /* Painel de Informações Estilo Glassmorphism */
        .info {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 22px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #status {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            color: var(--text-muted);
            letter-spacing: 0.4px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .control-group.full-width {
            grid-column: span 2;
        }

        .control-group label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        select, button {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            width: 100%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        select {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        select option {
            background-color: #121212;
            color: var(--text-color);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Player de Áudio minimalista */
        .audio-container {
            margin-bottom: 10px;
            opacity: 0.75;
            transition: opacity 0.2s;
        }
        .audio-container:hover {
            opacity: 1;
        }
        audio {
            height: 28px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Player de Áudio -->
    <div class="audio-container">
        <audio controls loop>
            <source src="audio/starwars-theme.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <h1>Marcelo Chess</h1>
    
    <!-- Tabuleiro -->
    <div id="board"></div>

    <!-- Informações e Controles -->
    <div class="info">
        <p id="status">Sua vez (Brancas)</p>
        
        <div class="controls-grid">
            <div class="control-group">
                <label for="playerColor">Sua Cor</label>
                <select id="playerColor">
                    <option value="w" selected>Brancas</option>
                    <option value="b">Pretas</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="difficulty">Dificuldade</label>
                <select id="difficulty">
                    <option value="easy">Fácil</option>
                    <option value="medium" selected>Médio</option>
                    <option value="hard">Difícil</option>
                </select>
            </div>

            <div class="control-group full-width">
                <button id="resetBtn">Nova Partida</button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Chessboard.js -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var statusEl = $('#status');
        var selectedSquare = null;
        var graySquares = [];
        var playerColor = 'w';
        var difficulty = 'medium';

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight');
            graySquares = [];
        }

        function greySquare(square) {
            var $square = $('#board .square-' + square);
            $square.addClass('highlight');
            graySquares.push(square);
        }

        function evaluateBoard(boardState) {
            var totalEvaluation = 0;
            var boardArray = boardState.board();
            for (var r = 0; r < 8; r++) {
                for (var c = 0; c < 8; c++) {
                    var piece = boardArray[r][c];
                    if (piece !== null) {
                        totalEvaluation += getPieceValue(piece);
                    }
                }
            }
            return totalEvaluation;
        }

        function getPieceValue(piece) {
            var value = 0;
            switch (piece.type) {
                case 'p': value = 10; break;
                case 'r': value = 50; break;
                case 'n': value = 30; break;
                case 'b': value = 30; break;
                case 'q': value = 90; break;
                case 'k': value = 900; break;
            }
            return piece.color === 'w' ? value : -value;
        }

        function makeSmartMove() {
            var possibleMoves = game.moves({ verbose: true });
            if (possibleMoves.length === 0 || game.game_over()) return;

            var chosenMove;
            var diff = $('#difficulty').val();

            if (diff === 'easy') {
                var randomIdx = Math.floor(Math.random() * possibleMoves.length);
                chosenMove = possibleMoves[randomIdx];
            } 
            else if (diff === 'medium') {
                var captures = possibleMoves.filter(function(move) {
                    return move.captured;
                });
                if (captures.length > 0 && Math.random() < 0.85) {
                    chosenMove = captures[Math.floor(Math.random() * captures.length)];
                } else {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                }
            } 
            else {
                var bestValue = (game.turn() === 'w') ? -99999 : 99999;
                var bestMoves = [];

                for (var i = 0; i < possibleMoves.length; i++) {
                    var move = possibleMoves[i];
                    game.move(move);
                    var value = evaluateBoard(game);
                    game.undo();

                    if (game.turn() === 'w') {
                        if (value > bestValue) {
                            bestValue = value;
                            bestMoves = [move];
                        } else if (value === bestValue) {
                            bestMoves.push(move);
                        }
                    } else {
                        if (value < bestValue) {
                            bestValue = value;
                            bestMoves = [move];
                        } else if (value === bestValue) {
                            bestMoves.push(move);
                        }
                    }
                }
                chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)] || possibleMoves[0];
            }

            game.move(chosenMove);
            board.position(game.fen());
            updateStatus();

            if (!game.game_over() && game.turn() !== playerColor) {
                window.setTimeout(makeSmartMove, 400);
            }
        }

        function maybeTriggerRobot() {
            if (!game.game_over() && game.turn() !== playerColor) {
                statusEl.text('Robô pensando...');
                window.setTimeout(makeSmartMove, 400);
            }
        }

        function onSquareClick(square) {
            if (game.turn() !== playerColor) return;

            if (selectedSquare !== null) {
                var move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    board.position(game.fen());
                    removeHighlights();
                    selectedSquare = null;
                    updateStatus();
                    maybeTriggerRobot();
                    return;
                }
            }

            var piece = game.get(square);
            if (piece !== null && piece.color === playerColor) {
                selectedSquare = square;

                var moves = game.moves({
                    square: square,
                    verbose: true
                });

                if (moves.length === 0) {
                    removeHighlights();
                    selectedSquare = null;
                    return;
                }

                removeHighlights();
                greySquare(square);
                for (var i = 0; i < moves.length; i++) {
                    greySquare(moves[i].to);
                }
            } else {
                removeHighlights();
                selectedSquare = null;
            }
        }

        function updateStatus() {
            var status = '';
            var isMyTurn = (game.turn() === playerColor);
            var moveColor = (game.turn() === 'w') ? 'Brancas' : 'Pretas';

            if (game.in_checkmate()) {
                var winner = (game.turn() === 'w') ? 'Pretas' : 'Brancas';
                status = 'Fim de jogo! Xeque-mate. ' + winner + ' venceram!';
            } else if (game.in_draw()) {
                status = 'Fim de jogo! Empate.';
            } else {
                status = isMyTurn ? 'Sua vez (' + (playerColor === 'w' ? 'Brancas' : 'Pretas') + ')' : 'Vez do Robô';
                if (game.in_check()) {
                    status += ' — ' + moveColor + ' em XEQUE!';
                }
            }

            statusEl.text(status);
        }

        function resetGame() {
            playerColor = $('#playerColor').val();
            difficulty = $('#difficulty').val();
            game.reset();
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.start();
            removeHighlights();
            selectedSquare = null;
            updateStatus();

            if (playerColor === 'b') {
                maybeTriggerRobot();
            }
        }

        var config = {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('board', config);

        $(document).on('click', '#board .square-55d63, #board img', function(e) {
            e.stopPropagation();
            var $squareDiv = $(this).hasClass('square-55d63') ? $(this) : $(this).closest('.square-55d63');
            var square = $squareDiv.attr('data-square');
            if (square) {
                onSquareClick(square);
            }
        });

        $('#resetBtn').on('click', resetGame);
        $('#playerColor').on('change', resetGame);
        $('#difficulty').on('change', function() {
            difficulty = $(this).val();
        });

        updateStatus();

        $(window).resize(function() {
            board.resize();
        });
    </script>
</body>
</html>
