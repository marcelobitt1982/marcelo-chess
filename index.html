<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marcelo Chess - Modern Edition</title>
    <!-- CSS do Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(24, 24, 27, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-color: #06b6d4;
            --accent-hover: #22d3ee;
            --accent-glow: rgba(6, 182, 212, 0.35);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(147, 51, 234, 0.05) 0%, transparent 50%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Container do Tabuleiro com Sombra Neon Fluida */
        #board {
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(6, 182, 212, 0.15);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        /* Cores modernas das casas do xadrez */
        .white-1e1d7 {
            background-color: #cbd5e1 !important;
        }
        .black-3c85d {
            background-color: #334155 !important;
        }

        /* Efeito de Destaque Animado Moderno */
        @keyframes pulseGlow {
            0% { box-shadow: inset 0 0 0 3px var(--accent-color), 0 0 10px var(--accent-glow); }
            50% { box-shadow: inset 0 0 0 5px var(--accent-hover), 0 0 20px var(--accent-glow); }
            100% { box-shadow: inset 0 0 0 3px var(--accent-color), 0 0 10px var(--accent-glow); }
        }

        .highlight {
            animation: pulseGlow 1.5s infinite ease-in-out;
            background-color: rgba(6, 182, 212, 0.25) !important;
        }

        /* Painel de Informações Estilo Glassmorphism */
        .info {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #status {
            font-size: 15px;
            font-weight: 500;
            margin: 0;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .controls-row {
            display: flex;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        select, button {
            background-color: var(--accent-color);
            color: #09090b;
            border: none;
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2);
        }

        select {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        select option {
            background-color: #18181b;
            color: var(--text-color);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Player de áudio minimalista integrado */
        .audio-container {
            margin-bottom: 12px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .audio-container:hover {
            opacity: 1;
        }
        audio {
            height: 32px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Player de Áudio -->
    <div class="audio-container">
        <audio controls loop>
            <source src="audio/starwars-theme.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <h1>Marcelo Chess</h1>
    
    <!-- Tabuleiro -->
    <div id="board"></div>

    <!-- Informações e Controles -->
    <div class="info">
        <p id="status">Sua vez (Brancas)</p>
        
        <div class="controls-row">
            <div class="control-group">
                <label for="playerColor">Sua Cor</label>
                <select id="playerColor">
                    <option value="w" selected>Brancas</option>
                    <option value="b">Pretas</option>
                </select>
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button id="resetBtn">Nova Partida</button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Chessboard.js -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var statusEl = $('#status');
        var selectedSquare = null;
        var graySquares = [];
        var playerColor = 'w';

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight');
            graySquares = [];
        }

        function greySquare(square) {
            var $square = $('#board .square-' + square);
            $square.addClass('highlight');
            graySquares.push(square);
        }

        function makeSmartMove() {
            var possibleMoves = game.moves({ verbose: true });

            if (possibleMoves.length === 0 || game.game_over()) return;

            var captures = possibleMoves.filter(function(move) {
                return move.captured;
            });

            var chosenMove;
            if (captures.length > 0 && Math.random() < 0.85) {
                var randomCaptureIdx = Math.floor(Math.random() * captures.length);
                chosenMove = captures[randomCaptureIdx];
            } else {
                var randomIdx = Math.floor(Math.random() * possibleMoves.length);
                chosenMove = possibleMoves[randomIdx];
            }

            game.move(chosenMove);
            board.position(game.fen());
            updateStatus();

            if (!game.game_over() && game.turn() !== playerColor) {
                window.setTimeout(makeSmartMove, 400);
            }
        }

        function maybeTriggerRobot() {
            if (!game.game_over() && game.turn() !== playerColor) {
                statusEl.text('Robô pensando...');
                window.setTimeout(makeSmartMove, 400);
            }
        }

        function onSquareClick(square) {
            if (game.turn() !== playerColor) return;

            if (selectedSquare !== null) {
                var move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    board.position(game.fen());
                    removeHighlights();
                    selectedSquare = null;
                    updateStatus();
                    maybeTriggerRobot();
                    return;
                }
            }

            var piece = game.get(square);
            if (piece !== null && piece.color === playerColor) {
                selectedSquare = square;

                var moves = game.moves({
                    square: square,
                    verbose: true
                });

                if (moves.length === 0) {
                    removeHighlights();
                    selectedSquare = null;
                    return;
                }

                removeHighlights();
                greySquare(square);
                for (var i = 0; i < moves.length; i++) {
                    greySquare(moves[i].to);
                }
            } else {
                removeHighlights();
                selectedSquare = null;
            }
        }

        function updateStatus() {
            var status = '';
            var isMyTurn = (game.turn() === playerColor);
            var moveColor = (game.turn() === 'w') ? 'Brancas' : 'Pretas';

            if (game.in_checkmate()) {
                var winner = (game.turn() === 'w') ? 'Pretas' : 'Brancas';
                status = 'Fim de jogo! Xeque-mate. ' + winner + ' venceram!';
            } else if (game.in_draw()) {
                status = 'Fim de jogo! Empate.';
            } else {
                status = isMyTurn ? 'Sua vez (' + (playerColor === 'w' ? 'Brancas' : 'Pretas') + ')' : 'Vez do Robô';
                if (game.in_check()) {
                    status += ' — ' + moveColor + ' em XEQUE!';
                }
            }

            statusEl.text(status);
        }

        function resetGame() {
            playerColor = $('#playerColor').val();
            game.reset();
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.start();
            removeHighlights();
            selectedSquare = null;
            updateStatus();

            if (playerColor === 'b') {
                maybeTriggerRobot();
            }
        }

        var config = {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png'
        };

        board = Chessboard('board', config);

        // Captura cliques em computadores e celulares perfeitamente
        $(document).on('click', '#board .square-55d63, #board img', function(e) {
            e.stopPropagation();
            var $squareDiv = $(this).hasClass('square-55d63') ? $(this) : $(this).closest('.square-55d63');
            var square = $squareDiv.attr('data-square');
            if (square) {
                onSquareClick(square);
            }
        });

        // Eventos
        $('#resetBtn').on('click', resetGame);
        $('#playerColor').on('change', resetGame);

        updateStatus();

        $(window).resize(function() {
            board.resize();
        });
    </script>
</body>
</html>
